#
# Shared SeaweedFS security configuration.
# Secret keys are injected via the WEED_* environment variables supported by SeaweedFS:
#   WEED_JWT_SIGNING_KEY / WEED_JWT_SIGNING_READ_KEY
#   WEED_JWT_FILER_SIGNING_KEY / WEED_JWT_FILER_SIGNING_READ_KEY

[cors.allowed_origins]
values = "https://localhost:3000,https://localhost:30001"

[jwt.signing]
expires_after_seconds = 300

[jwt.signing.read]
expires_after_seconds = 300

[jwt.filer_signing]
expires_after_seconds = 300

[jwt.filer_signing.read]
expires_after_seconds = 300
